name: Publish release and template package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@dayour'
      - name: Build and check release archives
        run: node scripts/package-release.cjs
      - name: Publish provisioning template to GitHub Packages
        working-directory: .release-output/template
        run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish GitHub Release and downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          .release-output/*.zip .release-output/*.tgz .release-output/SHA256SUMS.txt
          --verify-tag --title "DCR Enabled Build $RELEASE_TAG"
          --notes-file "releases/$RELEASE_TAG.md"